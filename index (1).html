<style>
:root{--bg:#f3ead8;--panel:#fbf5e6;--ink:#2a1d14;--mute:#6f5c4a;--acc:#8c1c1c;--gold:#9a7418;--line:#d8c8a6;--btn:#8c1c1c;--btnt:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140d0d;--panel:#1f1514;--ink:#eadfcc;--mute:#a8957c;--acc:#d2483a;--gold:#d9aa3c;--line:#3a2a26;--btn:#a82a22;--btnt:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140d0d;--panel:#1f1514;--ink:#eadfcc;--mute:#a8957c;--acc:#d2483a;--gold:#d9aa3c;--line:#3a2a26;--btn:#a82a22;--btnt:#fff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,'Times New Roman',serif}
.w{max-width:860px;margin:0 auto;padding:16px}
h1,h2,h3{font-weight:normal;letter-spacing:.04em;margin:.2em 0}
h1{color:var(--acc);font-size:1.9rem;text-align:center}
h2{color:var(--gold);font-size:1.1rem;text-transform:uppercase;margin-top:1.2em}
.sub{text-align:center;color:var(--mute);margin-bottom:1em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
label{display:block;font-size:.8rem;color:var(--mute);margin:6px 0 2px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.ch{display:block;width:100%;text-align:left;margin:6px 0;background:var(--panel);color:var(--ink);border:1px solid var(--gold)}
.ch:hover{background:var(--line)}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.8rem}
.bar div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.bar b{display:block;color:var(--gold);font-size:1rem}
.story p{margin:.7em 0}
.log{color:var(--mute);font-size:.9rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:0 8px;margin:2px;color:var(--mute)}
.note{font-size:.8rem;color:var(--mute)}
.hid{display:none}.traitrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}.traitrow label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px;margin:0}.traitrow input{width:auto}

.tabs{flex-wrap:wrap}.tabs button{flex:1 1 22%}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior-y:none}button{touch-action:manipulation;min-height:44px}input,select,textarea{font-size:16px}

elephant:'The beast was found by hunters in the forest, pale as moonlight, and the court is buzzing. Such an animal is a sign of divine favour, and also a tempting gift for a king who wishes to make a point.',

janissaries:'The corps parades in perfect ranks, but the drums beat in an unfamiliar rhythm and their officers do not meet your eye. They have made kings before, and they have unmade them too.',

matchmaking:'Envoys have been sending portraits, gifts and polite hints for months. A marriage can bind a rival to your house for generations, or tie your child to someone who will wreck everything.',

sibling:'The quarrel began over something small, but old resentments, gifts and favourites have fed it until it is now the talk of the nursery and the stables alike. Rivalries among royal children have a way of outliving the children.'};

{k:'schooling',if:()=>S.heirs.some(h=>h.age>=5&&h.age<18),t:'Your {yg} {yn}, aged {ya}, is old enough for serious lessons, and the tutors are competing for the honour of teaching.',c:[['Hire a famous scholar','p',{g:-6,p:3},'{yn} blossoms into a bookish and sharp-minded youth.',{g:-6},'The scholar is brilliant and impossible to understand.',c=>setTr(c.yn,'bookish')],['Train {yn} among soldiers','m',{m:3,s:1},'{yn} grows brave and tough.',{h:-3,s:-1},'{yn} comes back bruised and sullen.',c=>setTr(c.yn,'brave')],['Let {yn} learn from court life','s',{s:2,p:1},'{yn} learns to read people as well as books.',{p:-2},'{yn} picks up only gossip and bad habits.',c=>setTr(c.yn,'witty')]]},
{k:'sibling',if:()=>S.heirs.length>=2&&S.heirs.some(h=>h.age>=4),t:'Your {hg} {hn} has fallen into a bitter rivalry with a sibling, and the nursery is divided into camps.',c:[['Make them reconcile publicly','p',{s:3,p:1},'The siblings embrace stiffly, and the court applauds.',{s:-3},'The forced peace fools nobody.'],['Send one to a distant fosterage','s',{s:2,r:6},'Distance cools tempers and wins goodwill abroad.',{s:-3},'The exiled child feels cast out.'],['Let them settle it','m',{s:-1,p:1},'They sort it out themselves and grow closer.',{s:-6,h:-2},'The quarrel turns ugly and lingers.']]},
{k:'matchmaking',if:()=>S.heirs.some(h=>h.age>=18),t:'Your {ag} {an}, now {aa}, is of age to marry, and the courts of the region are already counting the advantages.',c:[['Betroth {an} to a scion of {rv}','p',{p:3,s:2,r:22},'The betrothal is sealed with gifts and oaths, and {rv} is bound closer.',{g:-8,r:-6},'The match collapses over dowry and pride.',c=>marryOff(c.an,'wed into '+c.rv)],['Let {an} choose a spouse for love','s',{s:4,p:1},'{an} marries someone cherished, and the people adore the story.',{s:-3},'The match is thought beneath the dynasty.',c=>marryOff(c.an,'wed for love')],['Keep {an} close at court, unwed','s',{s:2},'{an} stays a valued counsellor.',{p:-2},'{an} grows restless and resentful.']]},
{k:'spouse',if:()=>S.sp,t:'{sn}, your spouse, {sd}.',c:[['Trust {sn}','p',{s:3,p:1},'Trust deepens your bond.',{s:-4},'The trust is betrayed.'],['Confront {sn}','s',{p:-1,s:2},'You clear the air.',{s:-5},'A bitter quarrel splits the court.'],['Give {sn} a lavish gift','p',{g:-8,s:4},'The gift softens every heart.',{g:-8},'The gift is mocked.']]},
{k:'consort',if:()=>S.conc&&S.sp,t:'{rv} offers {cn} as a consort for your household.',c:[['Accept {cn}',null,{p:2,s:-3,r:10},'{cn} joins your household; the court gossips.',null,'',c=>S.consorts.push({name:c.cn,age:ri(18,30),gender:'Woman'})],['Decline politely','p',{r:-3},'{rv} shrugs it off.',{r:-8,p:-2},'{rv} takes offence.']]},
{k:'marriage',if:()=>!S.sp&&S.p.age>=18,t:'{sn}, aged {sa}, of the retinue of {rv}, is proposed as your spouse.',c:()=>[['Accept the match with {sn}',null,{p:4,s:4,r:18},'The wedding unites two houses.',null,'',c=>{S.sp={name:c.sn,age:c.sa,dyn:R(['Alpha','Beta','Omega'])}}],['Decline politely','p',{r:-6},'The envoys leave grumbling.',{r:-10,p:-2},'The refusal is taken as an insult.'],S.blood?['Wed your cousin {sn} to keep the blood pure',null,{s:3,p:-2},'Tradition is honoured, eyebrows rise.',null,'',c=>{S.sp={name:c.sn,age:c.sa,dyn:R(['Alpha','Beta','Omega'])}}]:['Marry for love: a commoner named {sn}',null,{s:-4,p:-3},'The people love the romance; the nobles sneer.',null,'',c=>{S.sp={name:c.sn,age:c.sa,dyn:R(['Alpha','Beta','Omega'])}}]]},
{k:'echo',if:()=>S.facts.length>=3,t:'People still speak of Year {fy}: {ft}. A pretender invokes the memory against you.',c:[['Honour the memory','p',{p:5,s:3},'The old story is turned to your credit.',{s:-3},'The memory proves heavier than expected.'],['Bury the past','s',{s:4},'You silence the talk.',{s:-6,p:-3},'The silence looks like guilt.'],['Exploit it','p',{g:10,p:2},'You profit from the legend.',{p:-6},'You are accused of grave-robbing history.']]}
];

{k:'instinct',if:()=>S.omega&&S.p.dyn!=='Beta',t:'The pull of your {dy} nature runs strong this season.',c:[['Retire to private chambers','s',{s:2},'You master the season in seclusion.',{s:-4},'Your absence is noticed.'],['Suppress it with herbs','s',{s:1},'The herbs work.',{h:-10},'The herbs sicken you.'],['Seek your spouse',null,{p:1},'A bond deepens, and is whispered about.',null,'',c=>{if(S.sp)born(0)}]]},
{m:'c',k:'market',t:'At the market, a trader offers you a share in a {gd} venture.',c:[['Invest your savings','p',{g:15,p:3},'The venture pays handsomely.',{g:-10},'The venture collapses.'],['Decline','s',{s:2},'Safe, if dull.',{p:-1},'Others profit instead.']]},
{m:'c',k:'gossip',t:'{npc} spreads gossip about your family.',c:[['Confront them publicly','p',{p:4},'Your boldness earns respect.',{p:-4,s:-3},'It turns into a scene.'],['Ignore it','s',{s:2},'The rumour fades.',{p:-2},'The rumour sticks.']]},
{m:'c',k:'hardship',t:'A hard season: debts press on your household.',c:[['Take extra work','s',{g:8,h:-3},'Long days, but you cope.',{g:2,h:-8},'You exhaust yourself.'],['Borrow from {rv}','p',{g:12,r:-5},'The loan is granted.',{g:-5,p:-3},'The lender mocks you.']]},
{m:'c',k:'patron',if:()=>S.st.p>=25,t:'{rv} offers you a minor title and lands for your service.',c:[['Accept the title',null,{p:5,g:10,r:15},'You are now lord of a small holding!',null,'',c=>{S.mode='ruler';S.station='noble';S.p.rank=1;S.p.title=rankTitle(1);S.st.t=2;S.st.m=40}],['Decline','p',{p:3},'Your independence is admired.',{r:-8},'The patron is offended.']]},
{m:'c',k:'ball',t:'An invitation arrives to a {feast} hosted by {rv}, where half the nobility will be present.',c:[['Attend in borrowed finery','p',{p:6,g:-5},'You catch the eye of several important guests.',{p:-4,g:-5},'Your borrowed finery is recognised and mocked.'],['Charm the staff and slip in','s',{p:3},'You listen to useful conversations unnoticed.',{p:-2},'You are escorted out in front of everyone.'],['Stay home','s',{s:2},'You save your coin and your pride.',{p:-1},'You wonder what you missed.']]},
{m:'c',k:'servant',t:'A servant in a great household offers to arrange a private word between you and someone important.',c:[['Pay the bribe','p',{g:-8,p:5},'The meeting goes well, and doors begin to open.',{g:-8,p:-2},'The servant takes the coin and vanishes.'],['Offer a favour instead','s',{p:3,s:1},'The servant is pleased, and you now have a friend.',{p:-2},'The servant finds your offer insulting.'],['Refuse','s',{s:2},'You keep your integrity and your savings.',{p:-1},'You feel the opportunity slip away.']]},
SX('dragon','wild dragon','A wild dragon raids the coast and {fo} blame you for the ruin.',['Fly {dn} to duel it','m',{p:10,m:3},'{dn} drives the beast into the sea.',{m:-10,h:-12},'{dn} is wounded, and so are you.'],['Lure it off with cattle','s',{g:-6,s:4},'The beast gorges and leaves.',{g:-10,s:-4},'It takes the cattle and returns.']),
SX('dragon','hatching','{dn}\'s eggs begin to crack and every house begs for one.',['Gift one to {rv}','p',{p:4,r:15},'{rv} is bound to you.',{r:2},'{rv} wanted more.'],['Keep them all','m',{m:8,r:-10},'Your dragon-host grows.',{m:2,r:-15},'The slight is not forgotten.']),
SX('eu','crusade','The Pope calls a crusade and {rv} urges you to take the cross.',['Join the crusade','m',{p:10,g:-15,t:1},'You return in glory.',{p:-3,g:-20,m:-10},'The crusade ends in disaster.'],['Send gold instead','p',{g:-10,p:3},'The Church is satisfied.',{g:-10,p:-3},'Your piety is questioned.']),
SX('eu','investiture','{fa} and your crown quarrel over who appoints bishops.',['Appoint your own','p',{p:5,s:-2},'The crown wins.',{p:-4,s:-8},'You are threatened with excommunication.'],['Yield to Rome','s',{s:4,p:-3},'Peace, at a price.',{s:1},'Nobody is grateful.']),
SX('vik','raiding','Spring comes and your warriors demand a raiding voyage.',['Lead it yourself','m',{g:20,p:5},'The longships return heavy with silver.',{m:-10,h:-8},'The raid is bloodily repulsed.'],['Forbid it','s',{s:2,m:-3},'Grumbling, they stay home.',{s:-8},'Your warriors defy you and sail.']),
SX('vik','the Thing','At the Thing, {npc} accuses you of breaking an oath.',['Swear on the holy ring','p',{p:5},'The assembly accepts your word.',{p:-8},'The ring is not kind to liars.'],['Pay weregild','p',{g:-12,s:3},'Honour is satisfied.',{g:-12},'It is taken as admission.']),
SX('byz','Greek fire','Your engineers offer a secret fire-weapon, but {fa} frowns on it.',['Use it','m',{m:8,p:3},'The enemy fleet burns.',{m:-6,h:-5},'The fire turns on your own ships.'],['Obey the Church','p',{p:4,s:2},'The clergy applaud.',{p:1},'It is seen as timidity.']),
SX('byz','Hippodrome','The racing factions riot in the Hippodrome.',['Send the guard','m',{s:4,p:-2},'Order returns.',{s:-8,m:-5},'The guard is pelted and flees.'],['Hold a free chariot day','p',{g:-8,s:5,p:3},'The mob roars approval.',{g:-8,s:-2},'The mob wants more.']),
SX('isl','vizier','The Grand Vizier hoards power and wealth.',['Dismiss him','p',{p:6,g:10},'You seize his fortune.',{s:-8},'His clients revolt.'],['Make him an ally','s',{s:4,g:-5},'He serves you eagerly.',{p:-3,g:-5},'He serves only himself.']),
SX('isl','princes','Counsellors urge you to imprison the princes of the blood.',['Imprison them','m',{s:5,p:-5},'The throne is safe, the court uneasy.',{s:-8},'One escapes and raises a banner.'],['Show mercy','p',{p:5},'Your mercy is praised.',{s:-6},'Mercy is mistaken for weakness.']),
SX('east','examinations','Scholars press for open examinations to staff the court.',['Open them','s',{s:5,p:3},'Talent rises.',{s:-5,p:-2},'The old families sabotage it.'],['Keep posts for noble families','m',{m:3,p:-2},'The nobles are pleased.',{s:-5},'The scholars grumble.']),
SX('east','regent','{rv} controls the palace guards and the court.',['Purge the faction','m',{p:8,s:-2},'You reclaim the palace.',{s:-10,h:-8},'The purge fails bloodily.'],['Marry into it','p',{r:20,s:3,p:-2},'Their power becomes yours.',{r:5},'They smile and keep scheming.']),
SX('rome','games','The mob demands bread and spectacle.',['Hold lavish games','p',{p:8,g:-15},'The arena thunders your name.',{g:-15},'The games bore the crowd.'],['Distribute grain','s',{s:5,g:-8},'The city is calm.',{g:-8,s:1},'The grain is stolen.']),
SX('rome','legions','The frontier legions mutter that they could crown their own emperor.',['Pay a donative','p',{g:-15,s:5},'The legions swear loyalty.',{g:-15,s:-5},'They take it and still mutter.'],['Execute the ringleaders','m',{m:3,s:3,p:-3},'Discipline returns.',{m:-10,s:-10},'The execution sparks mutiny.']),
SX('egy','Nile flood','The Nile flood falls short and granaries thin.',['Open the royal stores','s',{s:6,g:-10},'The people survive.',{s:-3,g:-15},'The stores are not enough.'],['Command the priests to pray','p',{s:3,p:3},'The waters rise late.',{s:-8,p:-5},'The flood never comes.']),
SX('egy','temple wealth','{fa} grows richer than the crown.',['Seize temple lands','m',{g:20,p:-3},'Your treasury swells.',{s:-8,p:-6},'The gods\' servants curse you.'],['Endow a rival temple','p',{g:-12,s:3},'Balance is restored.',{g:-12},'Nothing changes.']),
SX('sea','sandugo','{rv} proposes a blood compact, a sandugo, to seal peace.',['Drink the compact','p',{p:5,r:25},'A sworn brotherhood is born.',{r:5},'The oath is sworn lightly.'],['Refuse','m',{p:2,r:-10},'You stand alone but strong.',{r:-20,s:-4},'They see you as an enemy.']),
SX('sea','monsoon','Foreign junks arrive on the monsoon wind, seeking {gd}.',['Trade openly','p',{g:18,p:3},'The port overflows with silver.',{g:-5,s:-3},'The traders swindle you.'],['Restrict them to your port','s',{g:8,s:2},'Controlled trade, steady gold.',{g:-2},'They sail on to your rivals.']),
SXr(/Norman/,'domesday','Your clerks propose a great survey of every hide of land, so that the crown knows exactly what it is owed.',['Order the survey','s',{g:15,s:-3},'The ledger is thorough, and the treasury rejoices.',{s:-8},'The barons hide their holdings and resent the clerks.'],['Rely on the old tallies','s',{s:2},'You avoid the quarrel and lose a little revenue.',{g:-6},'The old tallies prove badly out of date.']),
SXr(/Hundred/,'chevauchee','English raiders burn a broad swath through the countryside, daring you to meet them.',['Offer pitched battle','m',{p:8,m:3},'Your knights break their line in a glorious charge.',{m:-15,s:-6},'The charge is shot to pieces by archers.'],['Shadow them and strike stragglers','s',{m:2,s:3},'Patient raids bleed the invaders.',{s:-4},'The raiders escape and mock your caution.']),
SXr(/Renaissance/,'condottieri','Your hired mercenary captain demands double pay, or he will sell his sword to your neighbour.',['Pay him double','p',{g:-15,m:5},'He swears he is yours, at least until the next payday.',{g:-15},'He pockets the coin and leaves anyway.'],['Dismiss him','m',{p:3},'Your authority is intact, if your army is thinner.',{m:-8,s:-4},'He joins your enemy with half your army.']),
SXr(/Heian/,'poetry','A poetry contest at court will decide whose clan is considered the most refined.',['Compose your own verse','p',{p:8},'Your verse is whispered all over the capital.',{p:-5},'Your verse is politely praised and privately mocked.'],['Sponsor a rising poet','s',{p:3,s:2},'The young poet repays you in fame.',{g:-5},'The poet defects to a rival house.']),
SXr(/Ming/,'treasure','Admirals propose a vast fleet to carry silk abroad and impress distant kings.',['Fund the fleet','p',{p:8,g:-15},'Distant rulers send tribute and envoys.',{g:-20,p:-3},'The fleet returns with little but bills.'],['Close the ports','s',{g:5,s:2},'The treasury is safe, if a little dull.',{p:-4},'Smugglers take over the trade you refused.']),
SXr(/Majapahit/,'vassals','Distant island vassals withhold tribute and test the limits of your reach.',['Send the fleet','m',{p:6,g:10},'The islands remember their oaths.',{m:-10,g:-8},'The fleet is scattered by storms and hostile warriors.'],['Send a royal envoy with gifts','p',{p:2,r:8},'Gentle diplomacy renews their loyalty.',{g:-6},'The envoy is received politely and ignored.']),
SXr(/Khmer/,'baray','The great reservoirs are silting up, priests demand a grander temple, and farmers beg for canals.',['Build the temple','p',{p:10,g:-15,s:-2},'A temple-mountain rises to the glory of the gods.',{g:-18,s:-6},'The temple is half finished when the money runs out.'],['Dig the canals','s',{g:8,s:5},'Fields flourish and the people bless you.',{g:-6,s:-2},'The canals are poorly planned and fill with silt.']),
SXr(/Pagan/,'pagoda','Monks urge you to earn great merit by raising a thousand shrines and pagodas.',['Raise them','p',{p:8,g:-12,s:3},'The skyline of the capital is transformed.',{g:-14,s:-3},'The costs spiral and the work is slow.'],['Tax monastic lands','m',{g:15,s:-5},'The treasury fills, and the monks mutter.',{s:-10,p:-5},'The monks rouse the villages against you.']),
SXr(/Ayutthaya/,'elephant','A white elephant is found in the forest, and the whole court declares it a sign of divine favour.',['Proclaim it an omen','p',{p:8,s:3},'The people take heart, and your legitimacy rises.',{p:-2},'The omen is mocked by your enemies.'],['Gift it to a rival king','p',{r:20,g:-4},'The rival is flattered and softened.',{r:-5,p:-4},'The rival is insulted at receiving a beast to feed.']),
SXr(/Philippine/,'babaylan','A babaylan priestess warns that the spirits of the river are displeased by your decrees.',['Heed her counsel','s',{s:5,p:2},'The people see you as a ruler who respects the old ways.',{s:-2},'Her demands multiply with each concession.'],['Defy her','m',{p:3,s:-6},'You stand tall against the priesthood.',{s:-12,p:-5},'A flood follows, and the people blame you.']),
SXr(/Ottoman/,'janissaries','The janissary corps demands a bonus and mutters about your rule.',['Pay the bonus','p',{g:-15,s:5},'The drums fall silent and the corps salutes.',{g:-15,s:-3},'They take the coin and still grumble.'],['Disband a regiment','m',{m:-3,p:4},'The corps learns who commands.',{m:-12,s:-10},'The regiment revolts and burns the market district.']),
SXr(/Abbasid/,'wisdom','Scholars from three continents ask you to fund a great library and translation house.',['Fund the House of Wisdom','p',{p:10,g:-12},'Your name is spoken wherever knowledge is valued.',{g:-14},'The scholars squabble and the project crawls.'],['Decline','s',{g:5,p:-2},'The treasury is relieved.',{p:-5},'Your rivals fund the scholars instead.'])
);
const SD=['has quietly befriended {npc}','prays daily for an heir','pleads for you to rest','spends heavily on a new garden'],HD=['picked a fight with a courtier\'s child','won praise for a clever answer','slipped away to ride alone','was caught eavesdropping on the council'];
let S=null,tab='feed';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function log(t){S.log.push({y:S.year,r:S.p.name,a:S.p.age,t})}
function fact(t){S.facts.push({y:S.year,t});S.facts=S.facts.slice(-60)}

E.push(
{k:'presentation',if:()=>/Regency England/.test(S.setting),t:'Your family is preparing for your presentation at court. The Queen\'s drawing room will decide whether society welcomes you.',c:[['Make a polished, graceful impression','p',{p:7,s:3},'You are received warmly, and invitations arrive in a steady stream.',{p:-3},'A small faux pas becomes the subject of whispers.'],['Charm the room with wit','s',{p:5,g:2},'Your wit wins admirers across the room.',{p:-2},'Your remarks are judged too bold.'],['Keep to the shadows and observe','m',{s:2,p:1},'You learn who matters without becoming the story.',{p:-2},'You are scarcely noticed.']]},
{k:'regency_ball',if:()=>/Regency England/.test(S.setting),t:'Lady Danbury\'s invitation promises a crowded ballroom, excellent music and the possibility of a consequential introduction.',c:[['Accept the first dance with a promising match','p',{p:6,s:2},'The dance is the talk of the evening, and a courtship begins.',{p:-2},'Your partner is distracted and the dance disappoints.'],['Spend the evening with influential hostesses','s',{p:3,g:3},'You leave with powerful allies and a fuller dance card.',{g:-3},'The hostesses find you rather dull.'],['Defy convention and slip out to the garden','m',{p:2},'A private conversation becomes a delicious secret.',{p:-3,s:-2},'You are discovered and the gossip columns stir.']]},
{k:'scandal_sheet',if:()=>/Regency England/.test(S.setting),t:'A society paper prints a damaging rumour about your family, and the ton is waiting to see how you respond.',c:[['Issue a dignified denial','p',{p:4,s:3},'Your composure robs the rumour of its force.',{p:-5},'The denial only gives the story another day of life.'],['Find the author and demand a retraction','m',{p:3,g:-3},'The printer apologises and the offending issue is withdrawn.',{p:-4,s:-3},'The confrontation becomes another scandal.'],['Turn the rumour into a joke','s',{p:5},'Society admires your nerve and moves on.',{p:-3},'The joke is repeated without its cleverness.']]},
{k:'promenade',if:()=>/Regency England/.test(S.setting),t:'At Hyde Park\'s fashionable promenade, a potential romantic interest is watching you from the opposite carriage.',c:[['Offer a measured greeting','p',{p:3,s:2},'A pleasant exchange leads to a future introduction.',{p:-1},'The greeting is politely ignored.'],['Walk with a trusted friend and trade observations','s',{p:3},'You learn the season\'s alliances and rivalries.',{p:-2},'Your companion repeats your observations.'],['Make a bold display of independence','m',{p:4},'Your confidence attracts attention.',{p:-3},'Society calls you improper.']]},
{k:'marriage_mart',if:()=>/Regency England/.test(S.setting),t:'Your family receives several inquiries about advantageous matches. The marriage mart is in full swing.',c:[['Encourage a match based on affection','s',{s:3,p:3},'A promising courtship begins on warmer terms.',{p:-2},'The proposed match cools.'],['Prioritise title, fortune and connections','p',{g:8,p:2},'A powerful family expresses interest.',{s:-2},'The match is judged calculating.'],['Refuse to be hurried','m',{s:2,p:1},'You preserve your independence for another Season.',{p:-2},'Your family worries that time is slipping away.']]}
,{k:'royal_family',if:()=>S.station==='ruler'&&(S.heirs.length>0||S.kin.some(x=>x.relation==='Sibling')),t:'A family gathering at the palace becomes unexpectedly lively: an heir has made a questionable wager, a sibling has taken offence, and everyone expects you to referee.',c:[['Turn it into a family game night','s',{s:4,p:2},'The quarrel dissolves into laughter, and the household feels closer.',{s:-3},'The game becomes fiercely competitive and two relatives stop speaking.'],['Hear each person out privately','p',{p:3,s:2},'You settle the matter with a few kind words and sensible compromises.',{p:-2},'Everyone believes you took the other side.'],['Remind them that the crown comes first','m',{p:4,s:-1},'The family remembers its duties, at least for this week.',{s:-5},'Your sternness becomes the newest family joke.']]},
